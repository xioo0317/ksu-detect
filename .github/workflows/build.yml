name: Build Android

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build
        run: make NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}" ABI=${{ matrix.abi }}

      - name: Verify ELF
        run: file build/ksu-detect-cpp_${{ matrix.abi }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ksu-detect_${{ matrix.abi }}
          path: build/ksu-detect-cpp_${{ matrix.abi }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package each ABI
        run: |
          set -e
          mkdir -p dist
          for d in artifacts/*/; do
            name=$(basename "$d")
            tar -C "$d" -czf "dist/${name}.tar.gz" .
          done
          ls -l dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
